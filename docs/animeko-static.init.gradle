// 使用上游已注册的 framework，仅切换为静态产物；不修改业务源码。
gradle.projectsEvaluated {
    def project = gradle.rootProject.findProject(':utils:platform')
    if (project == null) return
    def target = project.kotlin.targets.getByName('iosSimulatorArm64')
    target.binaries.findAll { it.name.endsWith('Framework') }.each { it.setStatic(true) }
}
