# macOS + Xcode + JDK 21 + Android SDK；复用独立的 compilers.yaml。
# JDK_JBR 环境变量指向本机 JBR 21 目录，上游 build-logic 要求这个 vendor。
projects:
  - repository: "https://github.com/open-ani/animeko.git"
    branch: "main"
    start_commit: "0e5575894362ed2e760f48b8e44d12f918d59672"
    end_commit: "e086c335ca21a7acb3d9bcb933eb6125223ce498"
    direction: forward                  # 连续 12 个提交；改成 reverse 可倒序回放。
    task: ":utils:platform:linkPodDebugFrameworkIosSimulatorArm64"
    gradle_args:
      - ":utils:ktor-client:linkPodDebugFrameworkIosSimulatorArm64"
      - ":utils:analytics:linkPodDebugFrameworkIosSimulatorArm64"
      - "-Pani.enable.ios=true"            # 上游默认不注册 iOS 目标。
      - "-Porg.gradle.java.installations.fromEnv=JDK_JBR"
      - "-I"
      - "/absolute/path/to/debug-ic-fuzzer/docs/animeko-static.init.gradle" # 改成此脚本的绝对路径。
