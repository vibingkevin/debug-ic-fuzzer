import groovy.json.JsonOutput

// 不修改被测项目：拦截插件解析，核验实际 KGP，强制执行 Native 链接。
def version = System.getenv('IC_EVAL_KOTLIN')
def evidence = new File(System.getenv('IC_EVAL_STEP'))
gradle.settingsEvaluated { settings ->
    // 同步约定插件使用的版本目录，避免父项目加载新插件后子项目仍请求旧版本。
    settings.dependencyResolutionManagement.versionCatalogs.configureEach { catalog ->
        catalog.version('kotlin', version)
    }
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id.startsWith('org.jetbrains.kotlin.')) useVersion(version)
    }
}
gradle.projectsEvaluated {
    def root = gradle.rootProject.projectDir.canonicalPath
    gradle.rootProject.allprojects { p ->
        def kotlin = p.extensions.findByName('kotlin')
        if (kotlin == null || !kotlin.hasProperty('targets')) return
        def plugin = p.plugins.findPlugin('org.jetbrains.kotlin.multiplatform')
        if (plugin != null) {
            def actual = plugin.class.classLoader.loadClass('org.jetbrains.kotlin.config.KotlinCompilerVersion').getField('VERSION').get(null)
            if (actual != version) throw new GradleException("Kotlin 插件实际版本 ${actual} 与配置 ${version} 不一致")
        }
        kotlin.targets.configureEach { target ->
            if (!target.hasProperty('konanTarget')) return
            target.compilations.configureEach { compilation ->
                compilation.compileTaskProvider.configure { task ->
                    task.compilerOptions.freeCompilerArgs.add("-Xklib-relative-path-base=${root}")
                }
            }
            target.binaries.configureEach { binary ->
                // 第三方单库 cache 的 DWARF 会写入编译器目录，发行包解压路径也需要映射。
                def compilerRoot = new File(System.getenv('IC_EVAL_HOME')).canonicalPath
                def mapping = "-Xdebug-prefix-map=${root}=/project,${compilerRoot}=/compiler"
                binary.freeCompilerArgs += mapping
                binary.freeCompilerArgs += "-Xoverride-konan-properties=additionalCacheFlags.${target.konanTarget.name}=${mapping}"
            }
        }
        p.tasks.configureEach { task ->
            if (!task.class.name.contains('KotlinNativeLink')) return
            def id = task.path.replace(':', '_')
            task.toolOptions.freeCompilerArgs.add("-Xdump-built-caches-to=${new File(evidence, id + '.rebuilt')}")
            // 每轮实际执行 Native 链接，不跳过，也不从构建缓存恢复。
            task.outputs.upToDateWhen { false }
            task.doFirst {
                evidence.mkdirs()
                def home = new File(task.konanHome.get()).canonicalPath
                if (home != new File(System.getenv('IC_EVAL_HOME')).canonicalPath)
                    throw new GradleException("实际编译器目录与配置不一致：${home}")
                new File(evidence, id + '.task.json').text = JsonOutput.toJson([
                    task: task.path, cwd: root, home: home, kotlin_version: version,
                    output: task.outputFile.get().absolutePath
                ])
            }
        }
    }
}
