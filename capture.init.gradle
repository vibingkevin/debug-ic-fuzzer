import groovy.json.JsonOutput

// Store only values so the action can run after Configuration Cache restoration.
class ReportNativeLink implements Action<Task>, Serializable {
    String version
    void execute(Task task) {
        task.logger.lifecycle('IC_FUZZER ' + JsonOutput.toJson([
            task: task.path, kotlin_version: version,
            home: new File(task.konanHome.get()).canonicalPath,
            output: task.outputFile.get().absolutePath
        ]))
    }
}

def version = gradle.startParameter.projectProperties['ic.kotlin.version']
def requestedTasks = gradle.startParameter.taskNames
if (requestedTasks.size() != 1) throw new GradleException('Specify exactly one final Native link task')

gradle.settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.versionCatalogs.configureEach { it.version('kotlin', version) }
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id.startsWith('org.jetbrains.kotlin.')) useVersion(version)
    }
}
gradle.projectsEvaluated {
    if (gradle.parent != null) return
    def task = gradle.rootProject.tasks.getByPath(requestedTasks[0])
    if (!task.class.name.contains('KotlinNativeLink')) throw new GradleException('The target must be a Native link task')
    def plugin = task.project.plugins.findPlugin('org.jetbrains.kotlin.multiplatform')
    def actual = plugin.class.classLoader.loadClass('org.jetbrains.kotlin.config.KotlinCompilerVersion').getField('VERSION').get(null)
    if (actual != version) throw new GradleException("Actual KGP version ${actual} does not match configured version ${version}")
    // Disable Build Cache only for the final link; preserve Configuration Cache, UP-TO-DATE, and dependency caching.
    task.outputs.doNotCacheIf('Native IC must execute instead of restoring a cached link output') { true }
    task.doFirst(new ReportNativeLink(version: version))
}
