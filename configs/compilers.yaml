compilers:
  baseline:
    kotlin_version: "2.4.21"              # Override KGP and the kotlin catalog version without editing project files.
    kotlin_native_home: "./baseline.tgz"   # Optional; KGP downloads to the tool-local .konan directory.
  sut:
    kotlin_version: "2.4.21"
