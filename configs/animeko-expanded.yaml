# Requires macOS, Xcode, CocoaPods, JDK 21, and Android SDK; use a separate compilers.yaml.
# Set JDK_JBR to a local JBR 21 directory; upstream build-logic requires this vendor.
repository: "https://github.com/open-ani/animeko.git"
branch: "main"
start_commit: "0e5575894362ed2e760f48b8e44d12f918d59672"
end_commit: "e086c335ca21a7acb3d9bcb933eb6125223ce498"
direction: forward                  # A 12-commit range; currently only the selected endpoint is built.
task: ":app:shared:application:linkPodDebugFrameworkIosSimulatorArm64"
gradle_args:
  - "-Pani.enable.ios=true"            # Enable the upstream iOS targets.
  - "-Pani.build.framework=true"        # Enable the framework used by the application.
  - "-Porg.gradle.java.installations.fromEnv=JDK_JBR"
