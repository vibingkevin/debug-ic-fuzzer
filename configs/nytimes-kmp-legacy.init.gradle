// BuildKonfig needs a nonempty API key even when only compiling the framework.
gradle.settingsEvaluated { settings ->
    def properties = new File(settings.settingsDir, 'local.properties')
    if (!properties.exists()) properties.text = 'apiKey=ic-fuzzer-build-only\n'
    settings.dependencyResolutionManagement.versionCatalogs.configureEach { it.version('skie', '0.10.16') }
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id == 'co.touchlab.skie') useVersion('0.10.16')
    }
}

gradle.projectsEvaluated {
    if (gradle.parent != null) return
    def task = gradle.rootProject.tasks.getByPath(':app:linkDebugFrameworkIosArm64')
    task.toolOptions.freeCompilerArgs.addAll([
        '-Xoverride-konan-properties=linkerKonanFlags.ios_arm64=-lc++ -lobjc -framework Foundation -framework UIKit',
        '-linker-option', '-lSystem',
        '-linker-option', '-objc_stubs_small'
    ])
}
