name: Shopping-By-KMP
run-name: ${{ inputs.scheduled && 'rotation' || github.event_name }} / Shopping-By-KMP

on:
  pull_request:
    paths:
      - '.github/workflows/shopping-by-kmp.yml'
      - 'configs/shopping-by-kmp*.yaml'
      - 'configs/shopping-by-kmp*.init.gradle'
      - 'configs/compilers-2.4.21-9267.yaml'
  workflow_dispatch:
    inputs:
      scheduled:
        description: Triggered by replay rotation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shopping-by-kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: ${{ matrix.range }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - range: legacy-page1
            project: configs/shopping-by-kmp-legacy.yaml
            java: '21'
          - range: legacy-page2
            project: configs/shopping-by-kmp-legacy-page2.yaml
            java: '21'
          - range: current
            project: configs/shopping-by-kmp.yaml
            java: '25'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer --pattern "$archive" --dir compilers --clobber
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore reusable build caches
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ic-dependencies-v3-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', matrix.project) }}
          restore-keys: |
            ic-dependencies-v3-macos-arm64-
      - name: Replay full range
        run: .venv/bin/python -u debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project "${{ matrix.project }}"
      - name: Save reusable build caches
        if: ${{ steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shopping-by-kmp-${{ matrix.range }}
          retention-days: 8
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
