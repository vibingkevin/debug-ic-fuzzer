name: NYTimes-KMP

on:
  pull_request:
    paths:
      - '.github/workflows/nytimes-kmp.yml'
      - 'configs/nytimes-kmp.yaml'
      - 'configs/nytimes-kmp.init.gradle'
      - 'configs/compilers-2.4.21-9267.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nytimes-kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: macos-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - start_at: 0
          - start_at: 25
            guard: true
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        if: ${{ !matrix.guard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer --pattern "$archive" --dir compilers --clobber
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore reusable build caches
        if: ${{ !matrix.guard }}
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: nytimes-kmp-dependencies-v1-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/nytimes-kmp.yaml', 'configs/nytimes-kmp.init.gradle') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nytimes-kmp-dependencies-v1-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/nytimes-kmp.yaml', 'configs/nytimes-kmp.init.gradle') }}-
            nytimes-kmp-dependencies-v1-macos-arm64-
      - name: Replay page
        env:
          START_AT: ${{ matrix.start_at }}
          GUARD: ${{ matrix.guard && 'true' || 'false' }}
        shell: bash
        run: |
          replay=(.venv/bin/python -u debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project configs/nytimes-kmp.yaml --start-at "$START_AT" --commit-count 25)
          if [ "$GUARD" = true ]; then
            set +e
            output=$("${replay[@]}" 2>&1)
            result=$?
            set -e
            printf '%s\n' "$output"
            if [ "$result" -eq 2 ] && grep -Eq "^--start-at $START_AT is outside the [0-9]+-commit range$" <<< "$output"; then
              echo 'Guard page is empty as expected.'
              exit 0
            fi
            echo '::error::Guard page did not report an empty range. Check the log; if it contains commits, extend the matrix and move the guard.'
            exit 1
          fi
          "${replay[@]}"
      - name: Require successful builds
        if: ${{ !matrix.guard }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          records = list(Path('run').glob('*/*-baseline.json')) + list(Path('run').glob('*/*-sut.json'))
          assert records, 'No build records'
          for path in records:
              result = json.loads(path.read_text())
              assert result['exit_code'] == 0 and result['error'] is None, f"Build failed: {path}"
          PY
      - name: Save reusable build caches
        if: ${{ always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nytimes-kmp-commits-${{ matrix.start_at }}
          retention-days: 8
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
