name: IC sample

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ic-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Install ELF tools
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Restore dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
            .konan/dependencies
          key: ic-dependencies-linux-x64-${{ hashFiles('configs/compilers*.yaml', 'configs/ic-sample-*.yaml') }}
      - name: Run unit tests
        run: .venv/bin/python -m pytest -q
      - name: Replay IC sample
        run: .venv/bin/python debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project configs/ic-sample-linux.yaml
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ic-sample-linux-x64
          retention-days: 3
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**