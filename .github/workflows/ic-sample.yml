name: IC sample
run-name: ${{ inputs.scheduled && 'rotation' || github.event_name }} / IC sample

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: Triggered by replay rotation
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'debug_ic_fuzzer.py'
      - 'impl/**'
      - '!impl/rotation.py'
      - 'tests/**'
      - '!tests/test_rotation.py'
      - 'configs/ic-sample-*.yaml'
      - 'configs/compilers-2.4.21-9267.yaml'
      - 'capture.init.gradle'
      - 'pyproject.toml'
      - '.github/workflows/ic-sample.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'debug_ic_fuzzer.py'
      - 'impl/**'
      - '!impl/rotation.py'
      - 'tests/**'
      - '!tests/test_rotation.py'
      - 'configs/ic-sample-*.yaml'
      - 'configs/compilers-2.4.21-9267.yaml'
      - 'capture.init.gradle'
      - 'pyproject.toml'
      - '.github/workflows/ic-sample.yml'

permissions:
  contents: read

concurrency:
  group: ic-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: ${{ matrix.platform }} / baseline-${{ matrix.baseline }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, macos-arm64, macos-x64]
        baseline: [incremental, clean]
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            project: configs/ic-sample-linux.yaml
            compilers: configs/compilers-2.4.21-9267.yaml
          - platform: macos-arm64
            os: macos-latest
            project: configs/ic-sample-ios.yaml
            compilers: configs/compilers-2.4.21-9267.yaml
          - platform: macos-x64
            os: macos-15-intel
            project: configs/ic-sample-ios.yaml
            compilers: configs/compilers-2.4.21-9267.yaml
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Install ELF tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Configure compiler build modes
        env:
          COMPILERS_CONFIG: ${{ matrix.compilers }}
          BASELINE_MODE: ${{ matrix.baseline }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          source = Path(os.environ['COMPILERS_CONFIG'])
          config = yaml.safe_load(source.read_text())
          config['compilers']['baseline']['clean_build'] = os.environ['BASELINE_MODE'] == 'clean'
          config['compilers']['sut']['clean_build'] = False
          source.with_name('ci-compilers.yaml').write_text(yaml.safe_dump(config))
          PY
      - name: Restore reusable build caches
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ic-dependencies-v2-${{ matrix.platform }}-${{ hashFiles('configs/compilers*.yaml', 'configs/ic-sample-*.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.baseline }}
          restore-keys: |
            ic-dependencies-v2-${{ matrix.platform }}-${{ hashFiles('configs/compilers*.yaml', 'configs/ic-sample-*.yaml') }}-
            ic-dependencies-v2-${{ matrix.platform }}-
      - name: Run unit tests
        run: .venv/bin/python -m pytest -q
      - name: Replay IC sample
        run: .venv/bin/python -u debug_ic_fuzzer.py --compilers configs/ci-compilers.yaml --project ${{ matrix.project }}
      - name: Save reusable build caches
        if: ${{ always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ic-sample-${{ matrix.platform }}-baseline-${{ matrix.baseline }}
          retention-days: 3
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
