name: IC sample

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ic-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            project: configs/ic-sample-linux.yaml
          - name: macos-arm64
            os: macos-15
            project: configs/ic-sample-ios.yaml
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Install ELF tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Restore dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
            .konan/dependencies
          key: ic-dependencies-${{ matrix.name }}-${{ hashFiles('configs/compilers*.yaml', 'configs/ic-sample-*.yaml') }}
      - name: Run unit tests
        run: .venv/bin/python -m pytest -q
      - name: Replay IC sample
        run: .venv/bin/python debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project ${{ matrix.project }}
      - name: Verify build failure and recovery
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          project = Path("${{ matrix.project }}").stem
          run, = Path("run").glob(f"*-{project}-*")
          commits = [
              "43749cd3bc80b5d78a66fc8e7b1f4c4bf1e5cb59",
              "e6907ee6d7328342ee7fabceaa417d2716aa7c13",
              "50c63396cded2b7cd0c01e757a7532ed1e731840",
          ]
          for index, commit in enumerate(commits):
              path, = run.glob(f"*-{commit[:12]}-comparison.json")
              prefix = path.name.removesuffix("-comparison.json")
              comparison = json.loads(path.read_text())
              assert comparison["strict_equal"] is comparison["production_equal"] is True
              assert comparison.get("both_failed", False) is (index == 1)
              for variant in ("baseline", "sut"):
                  result = json.loads((run / f"{prefix}-{variant}.json").read_text())
                  assert result["commit"] == commit
                  assert (result["exit_code"] != 0) is (index == 1)
                  if index != 1:
                      assert result["task_state"] == "EXECUTED" and result["artifacts"]
          print("Both builds failed at the intermediate commit and linked successfully after recovery.")
          PY
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ic-sample-${{ matrix.name }}
          retention-days: 3
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
