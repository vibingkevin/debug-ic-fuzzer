name: IC sample

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ic-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            project: configs/ic-sample-linux.yaml
            compilers: configs/compilers-2.4.21-9267.yaml
          - name: macos-arm64
            os: macos-15
            project: configs/ic-sample-ios.yaml
            compilers: configs/compilers-2.4.21-9267.yaml
          - name: macos-x64
            os: macos-15-intel
            project: configs/ic-sample-ios.yaml
            compilers: configs/compilers-2.4.21.yaml
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Install ELF tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Restore reusable build caches
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ic-dependencies-v2-${{ matrix.name }}-${{ hashFiles('configs/compilers*.yaml', 'configs/ic-sample-*.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ic-dependencies-v2-${{ matrix.name }}-${{ hashFiles('configs/compilers*.yaml', 'configs/ic-sample-*.yaml') }}-
            ic-dependencies-v2-${{ matrix.name }}-
      - name: Run unit tests
        run: .venv/bin/python -m pytest -q
      - name: Replay IC sample
        run: .venv/bin/python -u debug_ic_fuzzer.py --compilers ${{ matrix.compilers }} --project ${{ matrix.project }}
      - name: Save reusable build caches
        if: ${{ always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ic-sample-${{ matrix.name }}
          retention-days: 3
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
