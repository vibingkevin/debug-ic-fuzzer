name: IC sample

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ic-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            project: configs/ic-sample-linux.yaml
            compilers: configs/compilers-2.4.21-9267.yaml
          - name: macos-arm64
            os: macos-15
            project: configs/ic-sample-ios.yaml
            compilers: configs/compilers-2.4.21-9267.yaml
          - name: macos-x64
            os: macos-15-intel
            project: configs/ic-sample-ios.yaml
            compilers: configs/compilers-2.4.21.yaml
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test]'
      - name: Install ELF tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Restore dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
            .konan/dependencies
          key: ic-dependencies-${{ matrix.name }}-${{ hashFiles('configs/compilers*.yaml', 'configs/ic-sample-*.yaml') }}
      - name: Run unit tests
        run: .venv/bin/python -m pytest -q
      - name: Replay IC sample
        run: .venv/bin/python debug_ic_fuzzer.py --compilers ${{ matrix.compilers }} --project ${{ matrix.project }}
      - name: Verify Native IC static caches
        shell: bash
        run: |
          .venv/bin/python - <<'PYTHON'
          import json
          from pathlib import Path

          (run,) = Path("run").iterdir()
          for variant in ("baseline", "sut"):
              evidence = []
              for record_path in run.glob(f"*-{variant}.json"):
                  record = json.loads(record_path.read_text())
                  if record["exit_code"] != 0 or record["error"] is not None or not record["rebuilt_cache_count"]:
                      continue
                  caches = [entry for entry in record["cache_files"] if entry["path"].startswith("project/.auto-cache/") and entry["path"].endswith(".a")]
                  log = (run / record["log"]).read_text()
                  if caches and "-Xenable-incremental-compilation" in log and "-Xic-cache-dir" in log:
                      evidence.append(record_path.name)
              assert evidence, f"{variant}: no successful Native IC build reported project static caches"
              archives = list((run / variant / ".auto-cache").rglob("*.a"))
              assert archives, f"{variant}: no project static cache archives exist"
              for archive in archives:
                  with archive.open("rb") as stream:
                      assert stream.read(8) == b"!<arch>\n" and archive.stat().st_size > 8, f"Invalid static cache: {archive}"
              print(f"{variant}: {len(evidence)} IC builds with reported caches; {len(archives)} actual static cache archives")
          PYTHON
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ic-sample-${{ matrix.name }}
          retention-days: 3
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
