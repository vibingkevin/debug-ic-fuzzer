name: Keyguard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: ${{ matrix.project }}-${{ matrix.start_at }}${{ matrix.guard && '-guard' || '' }}
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: keyguard-ios, start_at: 0 }
          - { project: keyguard-ios, start_at: 50 }
          - { project: keyguard-ios, start_at: 100 }
          - { project: keyguard-ios, start_at: 150 }
          - { project: keyguard-ios, start_at: 200 }
          - { project: keyguard-ios, start_at: 250 }
          - { project: keyguard-ios, start_at: 300 }
          - { project: keyguard-ios, start_at: 350 }
          - { project: keyguard-ios, start_at: 400 }
          - { project: keyguard-ios, start_at: 450 }
          - { project: keyguard-ios, start_at: 500, guard: true }
          - { project: keyguard-apple, start_at: 0 }
          - { project: keyguard-apple, start_at: 50 }
          - { project: keyguard-apple, start_at: 100 }
          - { project: keyguard-apple, start_at: 150 }
          - { project: keyguard-apple, start_at: 200 }
          - { project: keyguard-apple, start_at: 250 }
          - { project: keyguard-apple, start_at: 300 }
          - { project: keyguard-apple, start_at: 350 }
          - { project: keyguard-apple, start_at: 400, guard: true }
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: 2
      PROJECT: ${{ matrix.project }}
      START_AT: ${{ matrix.start_at }}
      GUARD: ${{ matrix.guard || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Prepare Rust target
        if: ${{ !matrix.guard }}
        run: rustup toolchain install beta-2026-07-15 --profile minimal --component clippy,rustfmt --target aarch64-apple-ios
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        if: ${{ !matrix.guard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer-validation --pattern "$archive" --dir compilers --clobber
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore dependency downloads
        if: ${{ !matrix.guard }}
        uses: actions/cache@v5
        with:
          path: |
            .gradle-home/caches/modules-2
            .gradle-home/wrapper/dists
            .konan/dependencies
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: keyguard-dependencies-${{ matrix.project }}-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/keyguard-*.yaml') }}
      - name: Replay page
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          .venv/bin/python debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project "configs/$PROJECT.yaml" --start-at "$START_AT" --commit-count 50 > evidence/replay.log 2>&1
          result=$?
          set -e
          cat evidence/replay.log
          if [ "$GUARD" = true ]; then
            if [ "$result" -eq 2 ] && grep -Eq "^--start-at $START_AT is outside the [0-9]+-commit range$" evidence/replay.log; then
              echo 'Guard page is empty as expected.'
              exit 0
            fi
            echo '::error::Guard page did not report an empty range. Check the log; if it contains commits, extend the matrix and move the guard.'
            exit 1
          fi
          exit "$result"
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project }}-${{ matrix.start_at }}
          retention-days: 7
          path: |
            evidence/**
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
