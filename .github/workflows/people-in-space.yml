name: PeopleInSpace
run-name: ${{ inputs.scheduled && 'rotation' || github.event_name }} / PeopleInSpace

on:
  pull_request:
    paths:
      - '.github/workflows/people-in-space.yml'
      - 'configs/people-in-space.yaml'
  workflow_dispatch:
    inputs:
      scheduled:
        description: Triggered by replay rotation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: people-in-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: macos-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer --pattern "$archive" --dir compilers --clobber
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore reusable build caches
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: people-in-space-dependencies-v1-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/people-in-space.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            people-in-space-dependencies-v1-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/people-in-space.yaml') }}-
            people-in-space-dependencies-v1-macos-arm64-
      - name: Replay full range
        run: .venv/bin/python -u debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project configs/people-in-space.yaml
      - name: Save reusable build caches
        if: ${{ always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: people-in-space
          retention-days: 8
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
