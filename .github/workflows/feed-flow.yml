name: FeedFlow
run-name: ${{ inputs.scheduled && 'rotation' || github.event_name }} / FeedFlow

on:
  pull_request:
    paths:
      - '.github/workflows/feed-flow.yml'
      - 'configs/feed-flow.yaml'
      - 'configs/feed-flow-skie.init.gradle'
      - 'configs/compilers-2.4.21-9267.yaml'
      - 'impl/comparison.py'
      - 'tests/test_results.py'
      - 'tests/test_frameworks.py'
  workflow_dispatch:
    inputs:
      scheduled:
        description: Triggered by replay rotation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feed-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: commits-${{ matrix.start_at }}${{ matrix.guard && '-guard' || '' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - start_at: 0
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 100
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 200
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 300
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 400
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 500
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 600
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 700
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 800
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 900
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 1000
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 1100
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 1200
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
          - start_at: 1300
            guard: true
            platform: macos-arm64
            compilers: configs/compilers-2.4.21-9267.yaml
            project: configs/feed-flow.yaml
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      COMPILERS: ${{ matrix.compilers }}
      PROJECT: ${{ matrix.project }}
      START_AT: ${{ matrix.start_at }}
      GUARD: ${{ matrix.guard || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        if: ${{ !matrix.guard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer --pattern "$archive" --dir compilers --clobber
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore reusable Swift snapshot package
        id: swift-package-cache
        if: ${{ !matrix.guard }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/feed-flow/swift
          key: feed-flow-swift-snapshot-v2-2026-11-19-a
      - name: Download Swift snapshot package
        if: ${{ !matrix.guard }}
        run: |
          mkdir -p .cache/feed-flow/swift
          package=.cache/feed-flow/swift/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-11-19-a-osx.pkg
          if [ ! -s "$package" ]; then
            curl --fail --location --retry 3 --output "$package" \
              https://download.swift.org/swift-6.4.x-branch/xcode/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-11-19-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-11-19-a-osx.pkg
          fi
          printf '%s  %s\n' 0c6a7348791470a1534efde076804e68a06e0fffd1808397d1213b48f51a4682 "$package" | shasum -a 256 -c -
      - name: Install Swift snapshot toolchain
        if: ${{ !matrix.guard }}
        run: |
          toolchain_id=org.swift.64202611191a
          package=.cache/feed-flow/swift/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-11-19-a-osx.pkg
          if ! xcrun --no-cache --toolchain "$toolchain_id" --find swiftc >/dev/null 2>&1; then
            sudo installer -pkg "$package" -target /
          fi
          swiftc_path="$(xcrun --no-cache --toolchain "$toolchain_id" --find swiftc)"
          swift_bin_dir="$(dirname "$swiftc_path")"
          default_ld="$(xcrun --no-cache --toolchain XcodeDefault --find ld)"
          if [ "$default_ld" != "$swift_bin_dir/ld" ]; then
            sudo cp "$default_ld" "$swift_bin_dir/ld"
          fi
          default_libtool="$(xcrun --no-cache --toolchain XcodeDefault --find libtool)"
          if [ "$default_libtool" != "$swift_bin_dir/libtool" ]; then
            sudo cp "$default_libtool" "$swift_bin_dir/libtool"
          fi
          echo "TOOLCHAINS=$toolchain_id" >> "$GITHUB_ENV"
          echo "PATH=$swift_bin_dir:$PATH" >> "$GITHUB_ENV"
          test "$(xcrun --no-cache --toolchain "$toolchain_id" --find ld)" = "$swift_bin_dir/ld"
          test "$(xcrun --no-cache --toolchain "$toolchain_id" --find libtool)" = "$swift_bin_dir/libtool"
          xcrun --no-cache --toolchain "$toolchain_id" --find swiftc
          xcrun --no-cache --toolchain "$toolchain_id" --find ld
          xcrun --no-cache --toolchain "$toolchain_id" --find libtool
          xcrun --no-cache --toolchain "$toolchain_id" swiftc --version
          xcrun --no-cache --toolchain "$toolchain_id" swiftc -frontend -help-hidden | grep -F -- '-prefix-map-sourceinfo'
      - name: Restore reusable build caches
        id: build-cache
        if: ${{ !matrix.guard }}
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ic-dependencies-v3-${{ matrix.platform }}-${{ hashFiles(matrix.compilers, matrix.project) }}
          restore-keys: |
            ic-dependencies-v3-${{ matrix.platform }}-
      - name: Replay page
        shell: bash
        run: |
          replay=(.venv/bin/python -u debug_ic_fuzzer.py --compilers "$COMPILERS" --project "$PROJECT" --start-at "$START_AT" --commit-count 100)
          if [ "$GUARD" = true ]; then
            set +e
            output=$("${replay[@]}" 2>&1)
            result=$?
            set -e
            printf '%s\n' "$output"
            if [ "$result" -eq 2 ] && grep -Eq "^--start-at $START_AT is outside the [0-9]+-commit range$" <<< "$output"; then
              echo 'Guard page is empty as expected.'
              exit 0
            fi
            echo '::error::Guard page did not report an empty range. Check the log; if it contains commits, extend the matrix and move the guard.'
            exit 1
          fi
          "${replay[@]}"
      - name: Save reusable Swift snapshot package
        if: ${{ !matrix.guard && steps.swift-package-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/feed-flow/swift
          key: feed-flow-swift-snapshot-v2-2026-11-19-a
      - name: Save reusable build caches
        if: ${{ steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: ${{ always() && !matrix.guard }}
        uses: actions/upload-artifact@v6
        with:
          name: feed-flow-${{ matrix.start_at }}
          retention-days: 7
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
