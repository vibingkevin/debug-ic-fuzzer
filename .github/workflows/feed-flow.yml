name: FeedFlow
run-name: ${{ inputs.scheduled && 'rotation' || github.event_name }} / FeedFlow

on:
  pull_request:
    paths:
      - '.github/workflows/feed-flow.yml'
      - 'configs/feed-flow.yaml'
      - 'configs/feed-flow-skie.init.gradle'
      - 'configs/feed-flow-rss-parser.init.gradle'
      - 'configs/compilers-2.4.21-9267.yaml'
  workflow_dispatch:
    inputs:
      scheduled:
        description: Triggered by replay rotation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feed-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: commits-${{ matrix.start_at }}${{ matrix.guard && '-guard' || '' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - start_at: 0
          - start_at: 25
          - start_at: 50
          - start_at: 75
          - start_at: 100
          - start_at: 125
          - start_at: 150
          - start_at: 175
          - start_at: 200
          - start_at: 225
          - start_at: 250
          - start_at: 275
          - start_at: 300
          - start_at: 325
          - start_at: 350
            guard: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      START_AT: ${{ matrix.start_at }}
      GUARD: ${{ matrix.guard || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        if: ${{ !matrix.guard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer --pattern "$archive" --dir compilers --clobber
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore reusable Swift snapshot package
        id: swift-package-cache
        if: ${{ !matrix.guard }}
        uses: actions/cache/restore@v5
        with:
          path: .cache/feed-flow/swift
          key: feed-flow-swift-snapshot-v1-2026-11-01-a
      - name: Download Swift snapshot package
        if: ${{ !matrix.guard }}
        run: |
          mkdir -p .cache/feed-flow/swift
          package=.cache/feed-flow/swift/swift-DEVELOPMENT-SNAPSHOT-2026-11-01-a-osx.pkg
          if [ ! -s "$package" ]; then
            curl --fail --location --retry 3 --output "$package" \
              https://download.swift.org/development/xcode/swift-DEVELOPMENT-SNAPSHOT-2026-11-01-a/swift-DEVELOPMENT-SNAPSHOT-2026-11-01-a-osx.pkg
          fi
          printf '%s  %s\n' 9582e21a1a7096f578fd1f616be8e8588259b516ce58885bac70eb345e3c49b6 "$package" | shasum -a 256 -c -
      - name: Install Swift snapshot toolchain
        if: ${{ !matrix.guard }}
        run: |
          toolchain_id=org.swift.65202611011a
          package=.cache/feed-flow/swift/swift-DEVELOPMENT-SNAPSHOT-2026-11-01-a-osx.pkg
          # xcrun answers with Xcode's own toolchain instead of failing when the requested toolchain is missing, so check the path it returns.
          from_xcode=*/XcodeDefault.xctoolchain/*
          swiftc_path="$(xcrun --no-cache --toolchain "$toolchain_id" --find swiftc 2>/dev/null || true)"
          if [ -z "$swiftc_path" ] || [[ "$swiftc_path" == $from_xcode ]]; then
            sudo installer -pkg "$package" -target /
            swiftc_path="$(xcrun --no-cache --toolchain "$toolchain_id" --find swiftc 2>/dev/null || true)"
          fi
          if [ -z "$swiftc_path" ] || [[ "$swiftc_path" == $from_xcode ]]; then
            echo "::error::Swift snapshot toolchain $toolchain_id is unavailable; xcrun resolved ${swiftc_path:-no swiftc} after installing $package"
            exit 1
          fi
          swift_bin_dir="$(dirname "$swiftc_path")"
          # Kotlin/Native takes every Apple tool from the selected toolchain, so give the snapshot the Xcode binaries it lacks.
          xcode_bin_dir="$(dirname "$(xcrun --no-cache --toolchain XcodeDefault --find ld)")"
          for tool in ld libtool dsymutil strip ar ranlib nm otool install_name_tool lipo; do
            if [ -e "$xcode_bin_dir/$tool" ] && [ ! -e "$swift_bin_dir/$tool" ]; then
              sudo cp "$xcode_bin_dir/$tool" "$swift_bin_dir/$tool"
            fi
          done
          echo "TOOLCHAINS=$toolchain_id" >> "$GITHUB_ENV"
          echo "PATH=$swift_bin_dir:$PATH" >> "$GITHUB_ENV"
          "$swift_bin_dir/swiftc" -frontend -help-hidden 2>&1 | grep -q -- '-prefix-map-sourceinfo' || {
            echo '::error::The installed Swift toolchain rejects -prefix-map-sourceinfo, which configs/feed-flow-skie.init.gradle passes to SKIE.'
            exit 1
          }
          test "$(xcrun --no-cache --toolchain "$toolchain_id" --find ld)" = "$swift_bin_dir/ld"
          test -x "$swift_bin_dir/libtool"
          xcrun --no-cache --toolchain "$toolchain_id" --find swiftc
          xcrun --no-cache --toolchain "$toolchain_id" --find ld
          xcrun --no-cache --toolchain "$toolchain_id" swiftc --version
      - name: Restore reusable build caches
        id: build-cache
        if: ${{ !matrix.guard }}
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ic-dependencies-v3-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/feed-flow.yaml') }}
          restore-keys: |
            ic-dependencies-v3-macos-arm64-
      - name: Replay page
        shell: bash
        run: |
          replay=(.venv/bin/python -u debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project configs/feed-flow.yaml --start-at "$START_AT" --commit-count 25)
          if [ "$GUARD" = true ]; then
            set +e
            output=$("${replay[@]}" 2>&1)
            result=$?
            set -e
            printf '%s\n' "$output"
            if [ "$result" -eq 2 ] && grep -Eq "^--start-at $START_AT is outside the [0-9]+-commit range$" <<< "$output"; then
              echo 'Guard page is empty as expected.'
              exit 0
            fi
            echo '::error::Guard page did not report an empty range. Check the log; if it contains commits, extend the matrix and move the guard.'
            exit 1
          fi
          "${replay[@]}"
      - name: Save reusable Swift snapshot package
        if: ${{ always() && !matrix.guard && steps.swift-package-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/feed-flow/swift
          key: feed-flow-swift-snapshot-v1-2026-11-01-a
      - name: Save reusable build caches
        if: ${{ always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: feed-flow-${{ matrix.start_at }}
          retention-days: 7
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
