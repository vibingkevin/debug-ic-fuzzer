name: Todometer-KMP
run-name: ${{ inputs.scheduled && 'rotation' || github.event_name }} / Todometer-KMP

on:
  pull_request:
    paths:
      - '.github/workflows/todometer.yml'
      - 'configs/todometer.yaml'
      - 'configs/todometer-legacy.yaml'
      - 'configs/todometer-ksp.init.gradle'
      - 'configs/compilers-2.4.21-9267.yaml'
  workflow_dispatch:
    inputs:
      scheduled:
        description: Triggered by replay rotation
        type: boolean
        default: false

permissions:
  contents: read

# Each commit pair takes about 10 minutes; some link and finish in 15 or less.
env:
  PAGE_SIZE: '25'

concurrency:
  group: todometer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - id: pages
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from impl.config import Project, load_config
          from impl.repository import prepare_repository

          page_size = int(os.environ["PAGE_SIZE"])
          pages = []
          for name in ("todometer-legacy", "todometer"):
              project = load_config(Path("configs") / f"{name}.yaml", Project)
              _, commits = prepare_repository(Path("repos"), project)
              print(f"{name}: {len(commits)} commits")
              pages.extend(
                  {"project": name, "start_at": start}
                  for start in range(0, len(commits), page_size)
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print("matrix=" + json.dumps(pages), file=output)
          PYTHON
  replay:
    needs: plan
    name: ${{ matrix.project }}-${{ matrix.start_at }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pages) }}
    env:
      PROJECT: configs/${{ matrix.project }}.yaml
      START_AT: ${{ matrix.start_at }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer --pattern "$archive" --dir compilers --clobber
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore reusable build caches
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ic-dependencies-v3-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', env.PROJECT) }}
          restore-keys: |
            ic-dependencies-v3-macos-arm64-
      - name: Replay page
        run: .venv/bin/python -u debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project "$PROJECT" --start-at "$START_AT" --commit-count "$PAGE_SIZE"
      - name: Save reusable build caches
        if: ${{ steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project }}-${{ matrix.start_at }}
          retention-days: 8
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
