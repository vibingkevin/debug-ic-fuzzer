name: KotlinConf
run-name: ${{ inputs.scheduled && 'rotation' || github.event_name }} / KotlinConf

on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: Triggered by replay rotation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kotlinconf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: macos-arm64
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Download fixed compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=kotlin-native-prebuilt-macos-aarch64-2.4.21-9267.tar.gz
          for attempt in 1 2 3; do
            if gh release download compiler-2.4.21-9267 --repo vibingkevin/debug-ic-fuzzer --pattern "$archive" --dir compilers --clobber; then
              break
            fi
            rm -f "compilers/$archive"
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to download $archive after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          printf '%s  %s\n' c59d73272d932b865f48d8187e6cca40694dfdbd30e46a776056680fd339bf2e "compilers/$archive" | shasum -a 256 -c -
      - name: Restore reusable build caches
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: kotlinconf-dependencies-v2-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/kotlinconf-app.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kotlinconf-dependencies-v2-macos-arm64-${{ hashFiles('configs/compilers-2.4.21-9267.yaml', 'configs/kotlinconf-app.yaml') }}-
            kotlinconf-dependencies-v2-macos-arm64-
      - name: Replay KotlinConf
        run: |
          .venv/bin/python -u debug_ic_fuzzer.py --compilers configs/compilers-2.4.21-9267.yaml --project configs/kotlinconf-app.yaml
      - name: Save reusable build caches
        if: ${{ always() && steps.build-cache.outputs.cache-primary-key != '' && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle-home/caches
            .gradle-home/wrapper/dists
            .konan/dependencies
            !.gradle-home/caches/**/.auto-cache/**
            !.gradle-home/caches/**/kotlin-native-ic-cache/**
            !.gradle-home/caches/**/*.lock
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kotlinconf-macos-arm64
          retention-days: 7
          path: |
            run/*/*.json
            run/*/*.csv
            run/*/*.log
            run/*/store/**
